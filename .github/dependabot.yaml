version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # A minor release of a 0.x package may be breaking; review it manually.
      - dependency-name: "curl-cffi"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "forumscraper"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The builder and runtime must stay on the same Python minor version.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
