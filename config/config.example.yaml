# Discord Webhook RSS Feed Monitor Configuration

# How often to check feeds (in seconds)
refresh_interval: 300

# Optional per-feed ordinary discovery interval; omit/null inherits refresh_interval.
# It does not change posting delays or independent price_check_interval scans.

# Delay between fetching separate feeds (in seconds)
# Increase this when a source rate-limits consecutive requests
delay_between_feeds: 0

# Delay between posting multiple updates (in seconds)
# This prevents rate limiting and allows users to read posts
delay_between_posts: 2

# Maximum age of posts to process (in days)
# Set to 0 or omit to process all posts regardless of age
max_post_age_days: 7

# Prune delivered entries, sent price notifications, and old price history at
# startup. Set to 0 to disable retention. If max_post_age_days is 0, this must
# also be 0; otherwise it must be at least max_post_age_days. Configuration
# validation enforces that pairing.
state_retention_days: 90

# Optional daily health summary. Leave health_webhook unset to disable.
# health_webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
# health_summary_interval: 86400

# List of feeds to monitor
feeds:
  # Example RSS feed
  - id: "example-tech-blog" # Required: stable and unique; do not change after deployment
    name: "Example Tech Blog"
    url: "https://example.com/feed.xml"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss" # Optional: 'rss' (default), 'xenforo', 'itmk_oglasnik', 'pazar3', 'proxnet', 'reklama5', 'reddit', 'arctic_shift', 'arctic_shift_nsfw', 'air_quality', 'ananas', 'anhoch', 'cccenter', 'ddstore', 'fakulteti_mk', 'gjirafa50', 'hetzner_auction', 'hetzner_cloud', 'hivetec', 'neksio', 'neptun', 'openrouter_models', 'openrouter_prices', 'setec', 'technomarket', 'time_mk', 'tweets', 'tweets_retweets', 'tweets_all', 'emsc', 'wolfinet', or 'woocommerce'
    # ordinary_check_interval: 3600 # Optional seconds between discovery checks; omit/null inherits refresh_interval
    webhook_name: "RSS Bot" # Optional: Custom name for the webhook
    webhook_avatar: "https://example.com/avatar.png" # Optional: Custom avatar URL
    embed_color: 5814783 # Optional: Components v2 accent color (default: 5814783 = blue)
    digest_threshold: 100 # Optional: max new entries posted individually; above this, one digest. null disables the digest.
    # stale_after_days: 7 # Optional: mark the feed stale when its newest entry is older than this

  # Hacker News RSS with official API enrichment: points, comments, domain,
  # front-page rank, the top comment for link posts, and Ask HN text.
  - id: "hacker-news"
    name: "Hacker News"
    url: "https://news.ycombinator.com/rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"
    adapter: "hackernews"
    # hackernews_min_score: 500 # Optional: only deliver stories at or above this score

  # Hetzner server auction. Optional query filters control which listings match:
  # max_price_eur, min_ram_gb, require_ecc, disk_type (nvme/sata/hdd),
  # min_disk_gb, location, cpu_search, include_fixed.
  - id: "hetzner-auction"
    name: "Hetzner Server Auction"
    url: "https://www.hetzner.com/_resources/app/data/app/live_data_sb.json?max_price_eur=150&min_ram_gb=64&disk_type=nvme&min_disk_gb=512"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "hetzner_auction"
    ordinary_check_interval: 300
    seed_existing_on_first_fetch: true
    webhook_name: "Hetzner Auction"
    webhook_avatar: "https://www.hetzner.com/_resources/themes/hetzner/images/favicons/android-icon-192x192.png"
    digest_threshold: null

  # Hetzner Cloud server-type availability. This is a price-only restock
  # monitor: it alerts when a server type becomes available in a location, not
  # when it sells out. Requires HETZNER_CLOUD_TOKEN in the environment. The URL
  # query filters locations and/or server types; omit them to track everything.
  - id: "hetzner-cloud-availability"
    name: "Hetzner Cloud Availability"
    url: "https://api.hetzner.cloud/v1/server_types?locations=fsn1,nbg1,hel1"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "hetzner_cloud"
    price_check_interval: 120
    restock_alerts: true
    price_ignore_increases: true
    seed_existing_on_first_fetch: true
    webhook_name: "Hetzner Cloud"
    webhook_avatar: "https://www.hetzner.com/_resources/themes/hetzner/images/favicons/android-icon-192x192.png"
    digest_threshold: null

  # Open-Meteo current air quality for Skopje. Posts once per day and again
  # when the European AQI category changes.
  - id: "air-quality-skopje"
    name: "Skopje Air Quality"
    url: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=41.9981&longitude=21.4254&current=european_aqi,pm10,pm2_5,us_aqi&timezone=Europe%2FSkopje"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "air_quality"
    ordinary_check_interval: 1800
    seed_existing_on_first_fetch: true
    webhook_name: "Air Quality"
    webhook_avatar: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f32b.png"
    digest_threshold: null

  # OpenRouter model catalog. Posts new tool-capable models, plus paid/free
  # tier changes and deprecation dates. Batch endpoints, aliases, and routers
  # are skipped; the first fetch is a silent baseline.
  - id: "openrouter-models"
    name: "OpenRouter Models"
    url: "https://openrouter.ai/api/v1/models"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "openrouter_models"
    ordinary_check_interval: 3600
    seed_existing_on_first_fetch: true
    webhook_name: "OpenRouter"
    webhook_avatar: "https://openrouter.ai/icon.png"
    digest_threshold: null

  # OpenRouter significant input-price drops. Price-only: no discovery job.
  # Increases and moves below 10% are ignored.
  - id: "openrouter-price-drops"
    name: "Price Drops"
    url: "https://openrouter.ai/api/v1/models"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "openrouter_prices"
    price_check_interval: 3600
    price_min_change_percentage: 10
    price_ignore_increases: true
    webhook_name: "OpenRouter"
    webhook_avatar: "https://openrouter.ai/icon.png"
    digest_threshold: null

  # Reddit RSS was discontinued in November 2026. Use the 'arctic_shift'
  # strategy below instead. The 'reddit' adapter still works for any RSS feed
  # that exposes separate outbound and discussion links.

  # Public GitHub repository releases feed
  - id: "github-cli-releases"
    name: "GitHub CLI Releases"
    url: "https://github.com/cli/cli/releases.atom"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"

  # Self-hosted GitLab project commit feed. The final path segment selects the branch.
  # The first non-empty fetch is a silent baseline; later checks only cover the
  # bounded recent history returned by GitLab's Atom feed.
  - id: "gitlab-horizon-application-main"
    name: "Horizon Application commits (main)"
    url: "https://gitlab.finki.ukim.mk/wp/horizon-application/-/commits/main.atom"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"
    seed_existing_on_first_fetch: true

  # Example XenForo forum thread
  - id: "forum-discussion"
    name: "Forum Discussion"
    url: "https://forum.example.com/threads/topic-name.12345/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "xenforo" # Use XenForo forum scraping strategy
    webhook_name: "Forum Bot"
    embed_color: 3447003 # Optional: Components v2 accent color

  # IT.mk Oglasnik index or category page; the first successful fetch seeds without notifications
  - id: "itmk-oglasnik"
    name: "IT.mk Oglasnik"
    url: "https://forum.it.mk/oglasnik/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "itmk_oglasnik"
    webhook_name: "Oglasnik Bot"

  # Reklama5 accepts generic search URLs; this category-584 example tracks computer parts and accessories.
  # The first successful result window is a silent baseline. Later checks are a bounded best-effort
  # future-listing feed, not a complete current-inventory import, and request at most three pages.
  # Edits, renewals, and reactivations for an already seen ad ID remain silent in the ordinary feed.
  # The independent price scan traverses the complete category within fixed safety bounds.
  - id: "reklama5-computer-parts"
    name: "Reklama5 Computer Parts and Accessories"
    url: "https://reklama5.com/Search?cat=584&sell=1&buy=0&trade=0&includeOld=1&includeNew=1"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "reklama5"
    price_check_interval: 3600
    webhook_name: "Reklama5 Bot"

  # Pazar3 discovery observes at most three newest pages and silently seeds the first scan.
  # The optional independent price scan requires a complete scope of at most 10 pages / 500
  # organic listings. All Pazar3 requests share a process-wide 20-second host delay.
  - id: "pazar3-computer-parts"
    name: "Pazar3 Computer Parts and Accessories"
    url: "https://www.pazar3.mk/oglasi/elektronika/delovi-za-kompjuteri-dodatoci/prodazba"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "pazar3"
    # Enable price_check_interval only when the configured scope advertises at most 500 listings.
    webhook_name: "Pazar3 Bot"

  # Anhoch new products plus opt-in selling-price monitoring
  - id: "anhoch-new-products"
    name: "Anhoch New Products"
    url: "https://www.anhoch.com/products?inStockOnly=2"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "anhoch"
    # Full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Ananas, Anhoch, CCCenter, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, PROXNet, Reklama5, Setec, Technomarket, Wolfinet, or WooCommerce. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    # Optional: 1-1000; only for price strategies. Price changes sent individually before one digest. Default 100.
    # price_inline_limit: 100
    # Optional low-value alert filters; the defaults below preserve current behavior
    # and post every detected change.
    # price_min_change_percentage: 5 # Skip changes below 5% of the previous price.
    # price_min_change_amount: 100 # Skip changes below 100 in the product's currency.
    # price_ignore_increases: false # Set true to post drops only.
    # restock_alerts: false # Alert when an out-of-stock product returns, without a price-move title.
    webhook_name: "Anhoch Bot"
    webhook_avatar: "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://www.anhoch.com&size=256"

  # Ananas new products and opt-in price monitoring for any category URL under
  # https://ananas.mk/kategorii/. The category filter is resolved from the live
  # category tree. Requires the ANANAS_ALGOLIA_SEARCH_KEY environment variable;
  # no search key is committed. Examples:
  # https://ananas.mk/kategorii/it-shop/kompjuteri-i-kompjuterska-oprema
  # https://ananas.mk/kategorii/it-shop/kompjuterski-komponenti
  # Uncomment the blocks below and add a real webhook to enable them.
  # - id: "ananas-computers"
  #   name: "Ananas Computers"
  #   url: "https://ananas.mk/kategorii/it-shop/kompjuteri-i-kompjuterska-oprema"
  #   webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #   strategy: "ananas"
  #   price_check_interval: 3600
  #   webhook_name: "Ananas Computers"
  # - id: "ananas-components"
  #   name: "Ananas Components"
  #   url: "https://ananas.mk/kategorii/it-shop/kompjuterski-komponenti"
  #   webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #   strategy: "ananas"
  #   price_check_interval: 3600
  #   webhook_name: "Ananas Components"

  # Neksio new products plus opt-in selling-price monitoring
  - id: "neksio-products"
    name: "Neksio Products"
    url: "https://g.store.neksio.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "neksio"
    # Full-catalog selling-price scan every hour. The immediate first scan stores
    # a silent baseline. Omit or set null to disable price monitoring.
    price_check_interval: 3600
    webhook_name: "Neksio Bot"

  # Hivetec latest products plus opt-in full-catalog price monitoring.
  # Only the exact credential-free HTTPS shop URL is accepted. Discovery compares the
  # latest 30 Store API products with WordPress publication timestamps and fails closed
  # if their IDs or order disagree. The immediate first scan stores a silent baseline.
  - id: "hivetec-products"
    name: "Hivetec Products"
    url: "https://hivetec.mk/shop/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "hivetec"
    price_check_interval: 3600
    webhook_name: "Hivetec Bot"

  # TechnoSapien and any other public WooCommerce shop through the Store API.
  # Use the shop root, /shop/, or a /product-category/<slug>/ URL to restrict a
  # feed to one category. Discovery reads the newest 30 products; price scans
  # read the complete catalog. Only HTTPS shop origins without credentials are
  # accepted, and product links and images must stay on the shop host.
  - id: "technosapien-products"
    name: "TechnoSapien"
    url: "https://technosapien.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "woocommerce"
    price_check_interval: 3600
    webhook_name: "TechnoSapien Bot"

  # Time.mk aggregated Macedonian news. The root URL fetches the default
  # tech + Macedonia + economy categories. Use /all (or /rss/all) for every
  # category, or /rss/<category>,<category> for a subset. Common slugs:
  # tehnologija, makedonija, ekonomija, vesti, svet, balkan, skopje, kultura,
  # sport, fudbal, kosarka, rakomet, tenis, avto, avtomoto, hrana, zdravje,
  # hronika, republika, style, scena, life, fun, magazin, patuvanja, sex,
  # sportdrugo.
  # New entries are enriched with the article summary and Open Graph image from
  # the Time.mk article page; enrichment is best-effort.
  - id: "time-mk-news"
    name: "Time.mk"
    url: "https://time.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "time_mk"
    seed_existing_on_first_fetch: true
    webhook_name: "Time.mk"

  # Fakulteti.mk student news. The root URL fetches all posts; use
  # /category/<slug>,<slug> for a subset. Categories: nasha-tema, obrazovanie,
  # nauka, kultura, zdravje, tehnologija, kolumni, zhivot, kariera, ostanato.
  - id: "fakulteti-mk"
    name: "Fakulteti.mk"
    url: "https://fakulteti.mk/category/obrazovanie,nauka,tehnologija,kariera"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "fakulteti_mk"
    seed_existing_on_first_fetch: true
    webhook_name: "Fakulteti.mk"

  # Tweets from a Nitter RSS profile feed. The strategy keeps original tweets
  # only (no replies, retweets, or pinned tweets), keeps the public Nitter
  # link (no X login), and uses attached media when the instance publishes it.
  # Nitter instances are volunteer-run and can disappear; the strategy retries
  # the same profile path on a short built-in list of known instances when the
  # configured one fails. Use an English Nitter instance: the filter matches
  # Nitter's English title prefixes.
  - id: "opencode-tweets"
    name: "OpenCode Tweets"
    url: "https://nitter.kareem.one/opencode/rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "tweets"
    seed_existing_on_first_fetch: true
    webhook_name: "OpenCode Tweets"
    digest_threshold: null

  # Reddit posts through the public Arctic Shift archive. Reddit's official
  # Data API is closed to new apps and RSS was discontinued in November 2026.
  # The strategy reads at most 300 newest posts from /r/<subreddit>/new,
  # returns them oldest-first, and skips stickied, NSFW, spoiler, removed, and
  # deleted posts. Only the /new listing is supported. Arctic Shift is an
  # independent archive; keep polling low-volume and respect 429 responses.
  # - id: "reddit-python"
  #   name: "r/python"
  #   url: "https://www.reddit.com/r/python/new"
  #   webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #   strategy: "arctic_shift"
  #   webhook_name: "Reddit"
  #
  # Use strategy: "arctic_shift_nsfw" for subreddits whose posts are all
  # over_18, such as adult community feeds.

  # EMSC earthquake alerts for the Macedonia/Balkans region. The URL must be an
  # EMSC FDSN event query; event links use the EMSC event ID. Use orderby=time
  # (descending) so limit selects the latest events; the strategy reverses the
  # response for delivery. time-asc is only useful with an explicit time window.
  # A swarm above 10 events sends one digest instead of individual cards.
  - id: "earthquakes-macedonia"
    name: "Earthquakes"
    url: "https://www.seismicportal.eu/fdsnws/event/1/query?format=json&minmagnitude=2.5&minlatitude=40&maxlatitude=43&minlongitude=19&maxlongitude=24&limit=50&orderby=time"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "emsc"
    ordinary_check_interval: 300
    seed_existing_on_first_fetch: true
    webhook_name: "Earthquakes"
    digest_threshold: 10

  # Gjirafa50 discovery checks the newest 30 in-stock products from either exact root:
  # https://gjirafa50.mk/ or https://gjirafa50.com/. Use a separate stable feed ID for
  # each storefront. Prices use MKD for .mk and EUR for .com. The independent price
  # scan partitions the priced catalog by cent-precise storefront-currency price
  # and is expensive, so use a six-hour or longer interval. The upstream search
  # index is live; scans are best-effort and may miss products that move during
  # the scan.
  - id: "gjirafa50-products"
    name: "Gjirafa50 Products"
    url: "https://gjirafa50.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "gjirafa50"
    price_check_interval: 21600
    webhook_name: "Gjirafa50 Bot"

  # Setec new products and opt-in selling-price monitoring; the first successful fetch seeds without notifications.
  # Discovery reads the newest 100 published products in one sorted query, so a product
  # staged before it goes on sale is still announced when it is published.
  - id: "setec-new-products"
    name: "Setec New Products"
    url: "https://setec.mk/e-prodazba"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "setec"
    # Full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Ananas, Anhoch, CCCenter, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, PROXNet, Reklama5, Setec, Technomarket, Wolfinet, or WooCommerce. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    webhook_name: "Setec Bot"

  # DDStore new products and opt-in selling-price monitoring; the first successful fetch seeds without notifications
  - id: "ddstore-new-products"
    name: "DDStore New Products"
    url: "https://ddstore.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "ddstore"
    # Independent full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Ananas, Anhoch, CCCenter, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, PROXNet, Reklama5, Setec, Technomarket, Wolfinet, or WooCommerce. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    webhook_name: "DDStore Bot"

  # CCCenter new products and opt-in selling-price monitoring
  - id: "cccenter-products"
    name: "CCCenter Products"
    url: "https://cccenter.mk/shop/?orderby=date"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "cccenter"
    # The first scan silently baselines scalar MKD prices; variable, range,
    # unavailable, and malformed prices are not snapshotted or alerted.
    price_check_interval: 3600
    webhook_name: "CCCenter Bot"

  # Technomarket category discovery and complete-scope effective-price monitoring.
  # Only credential-free HTTPS category roots of the exact form below are accepted.
  # Discovery traverses the complete bounded category and silently seeds the first
  # successful non-empty scan. This is more expensive than a first-page check, so
  # use a conservative refresh interval. Price monitoring compares SMART when
  # present, otherwise regular price; a regular-only change is silent while SMART
  # is unchanged.
  - id: "technomarket-laptops"
    name: "Technomarket Laptops"
    url: "https://tehnomarket.com.mk/category/4003/laptopi"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "technomarket"
    price_check_interval: 3600
    webhook_name: "Technomarket Bot"

  # One Neptun category's newest products and opt-in actual-price monitoring
  - id: "neptun-computers"
    name: "Neptun Computers"
    url: "https://www.neptun.mk/KOMPJUTERI.nspx"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "neptun"
    # Bounded complete-category scan every hour. The first scan is a silent baseline.
    price_check_interval: 3600
    webhook_name: "Neptun Bot"

  # PROXNet category discovery and optional complete-category price monitoring.
  # The category URL must use the /mk/ prefix; product, search, cart, and account
  # pages are rejected. Full scans traverse up to 11 pages for this category, so
  # the example uses a six-hour price interval.
  # - id: "proxnet-networking"
  #   name: "PROXNet Networking"
  #   url: "https://www.proxnet.mk/mk/17-mrezhna-oprema"
  #   webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #   strategy: "proxnet"
  #   price_check_interval: 21600
  #   webhook_name: "PROXNet Bot"

  # Wolfinet Odoo shop discovery and optional full-shop price monitoring.
  # The URL must be the exact credential-free shop root; full scans traverse
  # 15+ pages, so the example uses a six-hour price interval.
  # - id: "wolfinet-shop"
  #   name: "Wolfinet"
  #   url: "https://wolfinet.com.mk/en/shop"
  #   webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  #   strategy: "wolfinet"
  #   price_check_interval: 21600
  #   webhook_name: "Wolfinet Bot"

  # Example feed 2
  - id: "another-feed"
    name: "Another Feed"
    url: "https://another-example.com/rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    # strategy defaults to 'rss' if not specified
    # webhook_name, webhook_avatar, and embed_color are optional

# Notes:
# - id: Stable unique ID containing lowercase letters, numbers, '.', '_', or '-' (required)
#   Delivery history is keyed by this value, so changing it will make old entries new again.
# - name: A friendly name for the feed (optional, will use feed/forum title if not provided)
# - url: The RSS/Atom feed, XenForo thread, marketplace page, Pazar3 listing URL,
#   Reklama5 search URL, or product catalog URL (required).
#   Reddit feeds use https://www.reddit.com/r/<subreddit>/new with the
#   'arctic_shift' strategy; only the /new listing is supported.
#   Public GitHub release feeds use https://github.com/OWNER/REPOSITORY/releases.atom
#   and render with a GitHub source label. GitLab project commit Atom feeds use
#   https://HOST/NAMESPACE/PROJECT/-/commits/BRANCH.atom and render with a GitLab
#   source label, including self-hosted GitLab instances. They do not require an adapter.
# - webhook: Discord webhook URL for posting updates (required)
# - strategy: Scraping strategy to use (optional, default: 'rss')
#   - 'rss': For RSS/Atom feeds (default)
#   - 'xenforo': For XenForo forum threads
#   - 'itmk_oglasnik': For IT.mk Oglasnik index and category pages
#   - 'pazar3': For bounded discovery and optional scoped price monitoring from Macedonian public listing URLs
#   - 'reklama5': For new ads and optional complete-category price monitoring from any Reklama5 search URL
#   - 'reddit': Legacy official Data API; requires an approved OAuth client and
#     REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET. New access is no longer accepted.
#   - 'arctic_shift': Reddit /new posts through the public Arctic Shift archive;
#     no OAuth credentials required, only the /new listing is supported.
#   - 'arctic_shift_nsfw': Same as arctic_shift but includes over_18 posts for
#     adult subreddits; spoilers and stickied/pinned posts are still skipped.
#   - 'ananas': For new products and optional price monitoring from any Ananas category URL
#   - 'anhoch': For new products from Anhoch's public catalog
#   - 'cccenter': For new products from CCCenter's public WooCommerce catalog
#   - 'hivetec': For new products from Hivetec's public WooCommerce catalog
#   - 'gjirafa50': For new products and full in-stock catalog price monitoring from Gjirafa50.mk or Gjirafa50.com
#   - 'neksio': For new products from Neksio's public catalog
#   - 'neptun': For new products from one Neptun category page
#   - 'proxnet': For new products and optional full-category price monitoring
#     from a PROXNet /mk/ category page
#   - 'setec': For new products from Setec's public catalog
#   - 'ddstore': For new products from DDStore's public GraphQL catalog
#   - 'technomarket': For new products from one public Technomarket category
#   - 'time_mk': For aggregated Macedonian news from a configurable Time.mk
#     category subset; the root URL defaults to tech + Macedonia + economy, and
#     new entries include the article summary and Open Graph image
#   - 'fakulteti_mk': For Fakulteti.mk student news from the root URL or a
#     /category/<slug>,<slug> subset; new entries include the summary and image
#   - 'wolfinet': For new products and optional full-shop price monitoring
#     from the Wolfinet Odoo shop root
#   - 'woocommerce': For new products and price monitoring from any public WooCommerce
#     Store API shop, using the shop root, /shop/, or a /product-category/<slug>/ URL
# - ordinary_check_interval: Optional positive finite seconds between ordinary discovery checks;
#   omit or set to null to inherit the global refresh_interval. Independent of price_check_interval.
# - seed_existing_on_first_fetch: Set to true for an RSS/Atom feed whose current
#   entries should be silently baselined before notifications. An empty fetch waits
#   for entries rather than initializing the feed. GitLab commit feeds expose only
#   bounded recent history, so commits older than that history cannot be recovered.
#   Reklama5 seeds the first successful result window silently, requests at most three
#   pages per ordinary cycle, and does not import complete current inventory. Changes,
#   renewals, and reactivations of the same ad ID remain silent. Its independent price
#   scan can traverse the complete configured category without changing discovery behavior.
# - digest_threshold: Optional positive integer, default 100. When a check finds
#   more new entries than this, one digest with HTML/CSV attachments is sent
#   instead of individual cards. Set to null to always post individual cards;
#   recommended for news feeds.
# - stale_after_days: Optional positive integer. When set, a feed whose newest
#   source entry is older than this is reported as stale instead of healthy.
#   Useful for detecting dead or paused upstream feeds.
# - price_inline_limit: Optional integer 1-1000, default 100, valid only for
#   price strategies. Price scans with up to this many changes send individual
#   cards; above it, one digest with HTML/CSV attachments. The pending outbox
#   uses the same limit, and decides by the pending group's size. CCCenter
#   confirms at most 100 changes per scan, so values above 100 do not increase
#   its card count.
# - price_min_change_percentage: Optional non-negative percentage, default 0
#   (disabled), valid only for price strategies. A detected change below this
#   percentage of the previous amount is not posted and only advances the stored
#   baseline. 5 means five percentage points.
# - price_min_change_amount: Optional non-negative absolute amount, default null
#   (disabled), valid only for price strategies. A detected change smaller than
#   this amount in the product's own currency is not posted and only advances
#   the stored baseline.
# - price_ignore_increases: Optional boolean, default false, valid only for price
#   strategies. When true, price increases are never posted; drops still alert.
#   A change is suppressed when any configured filter matches, and comparisons
#   that cannot be established (currency change or previous amount at or below
#   zero) still alert. These defaults preserve current behavior: every detected
#   price change is posted.
# - restock_alerts: Optional boolean, default false, valid only for Ananas,
#   Anhoch, CCCenter, DDStore, Neptun, and WooCommerce. When true, a product
#   that was reported out of stock and is now reported in stock posts one
#   restock card even if its price did not move, and price moves while a
#   product is out of stock are never posted (they only advance the stored
#   baseline). Restock alerts bypass price_min_change_percentage,
#   price_min_change_amount, and price_ignore_increases; a restock that also
#   moved in price carries the price-change percentage. Restocks with no price
#   change are counted separately in bulk digests. When false, availability is
#   still stored so a later scan can detect the change, but no restock is ever
#   posted.
# - price_check_interval: Optional seconds between Ananas, Anhoch, CCCenter, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, PROXNet, Reklama5, Setec, Technomarket, or WooCommerce
#   price scans. Set to 3600 for hourly checks. Omit or set to null to
#   disable; it is invalid for other feeds. The first scan runs immediately and
#   silently creates a baseline snapshot. Ananas uses the public Algolia proxy at
#   api.ananas.rs and requires ANANAS_ALGOLIA_SEARCH_KEY in the environment.
#   Any category URL under https://ananas.mk/kategorii/ is supported and resolved
#   from the live category tree. Discovery requests use a 7-day first-published
#   window bounded by the same 20-page / 12,000-hit limits. Full scans use 1,000
#   hits per page, cap each response at 2 MiB and each scan at 42 MiB / 600
#   seconds, and re-read page zero to detect index drift. Marketplace drift is
#   tolerated best-effort, but a scan must cover at least 95% of the initial
#   inventory count. Anhoch scans use 500 products per
#   page, a 2 MiB per-response cap, and a 200 MiB total cap. Neksio scans enumerate
#   homepage categories, use 100 products per page, and cap each response at 1 MiB;
#   a scan fails above 100 categories, 100 pages per category, or 10,000 products.
#   Hivetec scans use 100 products per page, at most 50 pages / 5,000 products,
#   a 1 MiB per-response cap, a retry-wide 20 MiB header-and-body cap, a 300-second
#   absolute deadline, and aggregate caps of 20,000 images and 20,000 categories.
#   Changed pagination totals, incomplete traversal, duplicate IDs, and aggregate
#   metadata excess fail closed.
#   WooCommerce scans accept any credential-free HTTPS shop root, /shop/, or
#   /product-category/<slug>/ URL, resolve the category through the public
#   Store API, use 30 products for discovery and 100 per page for full scans,
#   and allow at most 50 pages / 5,000 products / 64 MiB / 300 seconds per
#   operation. Only products whose links stay on the configured shop host are
#   accepted; price scans skip out-of-stock and zero-price products.
#   Gjirafa50 scans accept only https://gjirafa50.mk/ or https://gjirafa50.com/,
#   use MKD for .mk and EUR for .com, process 24 products per page, recursively
#   split cent-precise storefront-currency ranges below 9,000 products, and allow at
#   most 7,000 requests / 150,000 products / 128 shards / 2 GiB / 60 minutes
#   per operation, including retries.
#   Counts, identities, prices, and terminal pages must reconcile best-effort;
#   a count inversion beyond 0.1% of the root (minimum 100 products) fails closed.
#   Setec queries the storefront's own search index rather than its product API.
#   A price scan first reads an exact, uncapped facet count, then enumerates the
#   catalogue by recursively halving the calculated-amount range until every
#   partition fits inside the index's 1,000-hit ceiling, fetching only product
#   ids and amounts. Display fields are then fetched for changed products alone,
#   in batches of 200 ids, so an unchanged catalogue costs one pass of roughly
#   1.7 MB instead of a full product download. A scan allows at most 25,000
#   products and 1,000 requests, with a 5 MiB per-response cap and a 500 MiB
#   total cap, and fails closed when the recovered products do not reconcile
#   with the facet count. Setec products without a current first-variant price
#   are skipped without deleting prior snapshots. Only published, web-active
#   products are indexed, so drafts are neither announced nor monitored. DDStore
#   scans use 500 products per page, up to 40 pages / 20,000 products, with a
#   2 MiB per-response cap, an 80 MiB total cap, and a 300-second time bound.
#   Neptun scans only the configured category, use 50 products per page, and allow
#   at most 100 pages / 5,000 products. Every category/API response is capped at
#   5 MiB and the complete scan at 500 MiB. Changed totals, incomplete scans, and
#   conflicting duplicate IDs fail closed. Only positive ActualPrice values are
#   snapshotted; at most 10,000 snapshots are retained and 100 changes delivered
#   per scan. Unavailable prices preserve the previous real snapshot.
#   Reklama5 price scans traverse at most 250 pages / 10,000 ads, cap each response
#   at 2 MiB and each attempt at 500 MiB / 600 seconds, and retry from page one.
#   HTTP 429 responses are retried on the same page after the advertised
#   Retry-After delay.
#   Only positive MKD prices are compared; unavailable prices preserve the previous
#   numeric snapshot. At most 10,000 snapshots are retained and 100 changes delivered.
#   Pazar3 price scans traverse at most 10 pages / 500 organic listings, cap each
#   response at 2 MiB and each attempt at 20 MiB / 300 seconds. Positive MKD and EUR
#   prices are compared without conversion. Every Pazar3 request shares a 20-second
#   process-wide host pacer. At most 10,000 snapshots are retained and 100 changes delivered.
# - adapter: Optional source-specific enrichment for RSS feeds
#   - 'hackernews': Author, points, comments, self-post text, and article domain
#   - 'reddit': Outbound/discussion links and normalized authors for RSS feeds
#     that expose both an outbound link and a discussion URL
# - hackernews_min_score: Minimum Hacker News score for the 'hackernews' adapter.
#   Stories below it are skipped before delivery.
# - webhook_name: Custom name for the webhook bot (optional)
# - webhook_avatar: HTTPS URL for the webhook avatar, up to 2,048 encoded
#   characters. Localhost, non-global IP literals, malformed hosts, and
#   credentials are rejected; DNS names are not resolved by rss2discord.
# - embed_color: Decimal color for the Components v2 container accent
#   The legacy key name is retained for compatibility (optional, default: 5814783)
