# Discord Webhook RSS Feed Monitor Configuration

# How often to check feeds (in seconds)
refresh_interval: 300

# Delay between fetching separate feeds (in seconds)
# Increase this when a source rate-limits consecutive requests
delay_between_feeds: 0

# Delay between posting multiple updates (in seconds)
# This prevents rate limiting and allows users to read posts
delay_between_posts: 2

# Maximum age of posts to process (in days)
# Set to 0 or omit to process all posts regardless of age
max_post_age_days: 7

# List of feeds to monitor
feeds:
  # Example RSS feed
  - id: "example-tech-blog" # Required: stable and unique; do not change after deployment
    name: "Example Tech Blog"
    url: "https://example.com/feed.xml"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss" # Optional: 'rss' (default), 'xenforo', 'itmk_oglasnik', 'pazar3', 'reklama5', 'anhoch', 'ddstore', 'gjirafa50', 'hivetec', 'neksio', 'neptun', or 'setec'
    webhook_name: "RSS Bot" # Optional: Custom name for the webhook
    webhook_avatar: "https://example.com/avatar.png" # Optional: Custom avatar URL
    embed_color: 5814783 # Optional: Components v2 accent color (default: 5814783 = blue)

  # Hacker News RSS with official API enrichment
  - id: "hacker-news"
    name: "Hacker News"
    url: "https://news.ycombinator.com/rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"
    adapter: "hackernews"

  # Reddit RSS with outbound/discussion link separation
  - id: "reddit-python"
    name: "r/Python"
    url: "https://www.reddit.com/r/python/.rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"
    adapter: "reddit"

  # Public GitHub repository releases feed
  - id: "github-cli-releases"
    name: "GitHub CLI Releases"
    url: "https://github.com/cli/cli/releases.atom"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "rss"

  # Example XenForo forum thread
  - id: "forum-discussion"
    name: "Forum Discussion"
    url: "https://forum.example.com/threads/topic-name.12345/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "xenforo" # Use XenForo forum scraping strategy
    webhook_name: "Forum Bot"
    embed_color: 3447003 # Optional: Components v2 accent color

  # IT.mk Oglasnik index or category page; the first successful fetch seeds without notifications
  - id: "itmk-oglasnik"
    name: "IT.mk Oglasnik"
    url: "https://forum.it.mk/oglasnik/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "itmk_oglasnik"
    webhook_name: "Oglasnik Bot"

  # Reklama5 accepts generic search URLs; this category-584 example tracks computer parts and accessories.
  # The first successful result window is a silent baseline. Later checks are a bounded best-effort
  # future-listing feed, not a complete current-inventory import, and request at most three pages.
  # Edits, renewals, and reactivations for an already seen ad ID remain silent in the ordinary feed.
  # The independent price scan traverses the complete category within fixed safety bounds.
  - id: "reklama5-computer-parts"
    name: "Reklama5 Computer Parts and Accessories"
    url: "https://reklama5.mk/Search?cat=584&sell=1&buy=0&trade=0&includeOld=1&includeNew=1"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "reklama5"
    price_check_interval: 3600
    webhook_name: "Reklama5 Bot"

  # Pazar3 discovery observes at most three newest pages and silently seeds the first scan.
  # The optional independent price scan requires a complete scope of at most 10 pages / 500
  # organic listings. All Pazar3 requests share a process-wide 20-second host delay.
  - id: "pazar3-computer-parts"
    name: "Pazar3 Computer Parts and Accessories"
    url: "https://www.pazar3.mk/oglasi/elektronika/delovi-za-kompjuteri-dodatoci/prodazba"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "pazar3"
    # Enable price_check_interval only when the configured scope advertises at most 500 listings.
    webhook_name: "Pazar3 Bot"

  # Anhoch new products plus opt-in selling-price monitoring
  - id: "anhoch-new-products"
    name: "Anhoch New Products"
    url: "https://www.anhoch.com/products?inStockOnly=2"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "anhoch"
    # Full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Anhoch, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, Reklama5, or Setec. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    webhook_name: "Anhoch Bot"
    webhook_avatar: "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://www.anhoch.com&size=256"

  # Neksio new products plus opt-in selling-price monitoring
  - id: "neksio-products"
    name: "Neksio Products"
    url: "https://g.store.neksio.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "neksio"
    # Full-catalog selling-price scan every hour. The immediate first scan stores
    # a silent baseline. Omit or set null to disable price monitoring.
    price_check_interval: 3600
    webhook_name: "Neksio Bot"

  # Hivetec latest products plus opt-in full-catalog price monitoring.
  # Only the exact credential-free HTTPS shop URL is accepted. Discovery compares the
  # latest 30 Store API products with WordPress publication timestamps and fails closed
  # if their IDs or order disagree. The immediate first scan stores a silent baseline.
  - id: "hivetec-products"
    name: "Hivetec Products"
    url: "https://hivetec.mk/shop/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "hivetec"
    price_check_interval: 3600
    webhook_name: "Hivetec Bot"

  # Gjirafa50 discovery checks the newest 30 in-stock products. The independent
  # price scan partitions the full catalog by integer MKD price and is expensive,
  # so use a six-hour or longer interval rather than hourly polling.
  - id: "gjirafa50-products"
    name: "Gjirafa50 Products"
    url: "https://gjirafa50.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "gjirafa50"
    price_check_interval: 21600
    webhook_name: "Gjirafa50 Bot"

  # Setec new products and opt-in selling-price monitoring; the first successful fetch seeds without notifications
  - id: "setec-new-products"
    name: "Setec New Products"
    url: "https://setec.mk/e-prodazba"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "setec"
    # Full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Anhoch, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, Reklama5, or Setec. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    webhook_name: "Setec Bot"

  # DDStore new products and opt-in selling-price monitoring; the first successful fetch seeds without notifications
  - id: "ddstore-new-products"
    name: "DDStore New Products"
    url: "https://ddstore.mk/"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "ddstore"
    # Independent full-catalog selling-price scan every hour. Omit or set null to disable;
    # valid only for Anhoch, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, Reklama5, or Setec. The immediate first scan stores a silent baseline.
    price_check_interval: 3600
    webhook_name: "DDStore Bot"

  # One Neptun category's newest products and opt-in actual-price monitoring
  - id: "neptun-computers"
    name: "Neptun Computers"
    url: "https://www.neptun.mk/KOMPJUTERI.nspx"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    strategy: "neptun"
    # Bounded complete-category scan every hour. The first scan is a silent baseline.
    price_check_interval: 3600
    webhook_name: "Neptun Bot"

  # Example feed 2
  - id: "another-feed"
    name: "Another Feed"
    url: "https://another-example.com/rss"
    webhook: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    # strategy defaults to 'rss' if not specified
    # webhook_name, webhook_avatar, and embed_color are optional

# Notes:
# - id: Stable unique ID containing lowercase letters, numbers, '.', '_', or '-' (required)
#   Delivery history is keyed by this value, so changing it will make old entries new again.
# - name: A friendly name for the feed (optional, will use feed/forum title if not provided)
# - url: The RSS/Atom feed, XenForo thread, marketplace page, Pazar3 listing URL,
#   Reklama5 search URL, or product catalog URL (required).
#   Public GitHub release feeds use https://github.com/OWNER/REPOSITORY/releases.atom
#   and render with a GitHub source label. They do not require an adapter.
# - webhook: Discord webhook URL for posting updates (required)
# - strategy: Scraping strategy to use (optional, default: 'rss')
#   - 'rss': For RSS/Atom feeds (default)
#   - 'xenforo': For XenForo forum threads
#   - 'itmk_oglasnik': For IT.mk Oglasnik index and category pages
#   - 'pazar3': For bounded discovery and optional scoped price monitoring from Macedonian public listing URLs
#   - 'reklama5': For new ads and optional complete-category price monitoring from any Reklama5 search URL
#   - 'anhoch': For new products from Anhoch's public catalog
#   - 'hivetec': For new products from Hivetec's public WooCommerce catalog
#   - 'gjirafa50': For new products and full in-stock catalog price monitoring from Gjirafa50.mk
#   - 'neksio': For new products from Neksio's public catalog
#   - 'neptun': For new products from one Neptun category page
#   - 'setec': For new products from Setec's public catalog
#   - 'ddstore': For new products from DDStore's public GraphQL catalog
#   Reklama5 seeds the first successful result window silently, requests at most three
#   pages per ordinary cycle, and does not import complete current inventory. Changes,
#   renewals, and reactivations of the same ad ID remain silent. Its independent price
#   scan can traverse the complete configured category without changing discovery behavior.
# - price_check_interval: Optional seconds between Anhoch, DDStore, Gjirafa50, Hivetec, Neksio, Neptun, Pazar3, Reklama5, or Setec
#   price scans. Set to 3600 for hourly checks. Omit or set to null to
#   disable; it is invalid for other feeds. The first scan runs immediately and
#   silently creates a baseline snapshot. Anhoch scans use 500 products per
#   page, a 2 MiB per-response cap, and a 200 MiB total cap. Neksio scans enumerate
#   homepage categories, use 100 products per page, and cap each response at 1 MiB;
#   a scan fails above 100 categories, 100 pages per category, or 10,000 products.
#   Hivetec scans use 100 products per page, at most 50 pages / 5,000 products,
#   a 1 MiB per-response cap, a retry-wide 20 MiB header-and-body cap, a 300-second
#   absolute deadline, and aggregate caps of 20,000 images and 20,000 categories.
#   Changed pagination totals, incomplete traversal, duplicate IDs, and aggregate
#   metadata excess fail closed.
#   Gjirafa50 scans accept only https://gjirafa50.mk/, use 24 products per page,
#   recursively split integer MKD price ranges below 9,000 products, and allow at
#   most 5,000 requests / 100,000 products / 128 shards / 500 MiB / 30 minutes
#   per operation, including retries.
#   Counts, identities, prices, terminal pages, and post-scan totals must reconcile.
#   Setec scans use
#   250 products per page, up to 100 pages / 25,000 products, with a 5 MiB
#   per-response cap and a 500 MiB total cap. Setec products without a current
#   first-variant price are skipped without deleting prior snapshots. DDStore
#   scans use 500 products per page, up to 40 pages / 20,000 products, with a
#   2 MiB per-response cap, an 80 MiB total cap, and a 300-second time bound.
#   Neptun scans only the configured category, use 50 products per page, and allow
#   at most 100 pages / 5,000 products. Every category/API response is capped at
#   5 MiB and the complete scan at 500 MiB. Changed totals, incomplete scans, and
#   conflicting duplicate IDs fail closed. Only positive ActualPrice values are
#   snapshotted; at most 10,000 snapshots are retained and 100 changes delivered
#   per scan. Unavailable prices preserve the previous real snapshot.
#   Reklama5 price scans traverse at most 250 pages / 10,000 ads, cap each response
#   at 2 MiB and each attempt at 500 MiB / 300 seconds, and retry from page one.
#   Only positive MKD prices are compared; unavailable prices preserve the previous
#   numeric snapshot. At most 10,000 snapshots are retained and 100 changes delivered.
#   Pazar3 price scans traverse at most 10 pages / 500 organic listings, cap each
#   response at 2 MiB and each attempt at 20 MiB / 300 seconds. Positive MKD and EUR
#   prices are compared without conversion. Every Pazar3 request shares a 20-second
#   process-wide host pacer. At most 10,000 snapshots are retained and 100 changes delivered.
# - adapter: Optional source-specific enrichment for RSS feeds
#   - 'hackernews': Author, points, comments, self-post text, and article domain
#   - 'reddit': Outbound/discussion links and normalized authors without OAuth
# - webhook_name: Custom name for the webhook bot (optional)
# - webhook_avatar: URL to custom avatar image for the webhook bot (optional)
# - embed_color: Decimal color for the Components v2 container accent
#   The legacy key name is retained for compatibility (optional, default: 5814783)
